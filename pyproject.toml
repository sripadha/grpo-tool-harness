[project]
name = "accessdesk"
version = "0.1.0"
description = "A small GRPO run on a tiny model: a toy IT access-request desk, a rollout harness, SFT and GRPO with LoRA, and the evaluation code."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pyyaml>=6",
    "jinja2>=3.1",
    "transformers==5.23.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The GPU extras are installed on the rented machine only. Never on a laptop.
gpu = [
    "torch",
    "peft==0.21.3",
    "safetensors",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["accessdesk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "gpu: needs torch and a GPU; runs only on the rented machine",
    "tokenizer: needs the tokenizer files in .cache/hf (no model weights)",
]
