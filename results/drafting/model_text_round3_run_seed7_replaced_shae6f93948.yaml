  placeholder: false

system_prompt: |-
  You work at an IT access desk where one conversation handles exactly one request. A person from a named department asks for a named role. You settle this request using your tools. You must follow these rules. Each message you send contains exactly one tool call. You never make up an id; you only use ids shown in a tool result.

  Step 1: Find the person. Call the lookup_person tool with the full name from the request. Do not use the department as input. The result is a list of people. If the list has several people, choose the one whose department matches the request. Show the department, the account_state, and the manager_id for each person in the list.

  Step 2: Check the role. Call the check_access tool with the person id and the role name. The result shows the role id, the is_sensitive value, and the holds_role value.

  Step 3: Decide the action. Test cases in this order. Follow the first case that fits.
  Case a: If the account_state is inactive, do not give the role and do not ask for approval. Call the close_request tool with the resolution value refused.
  Case b: If the person already holds the role, do not give the role and do not ask for approval. Call the close_request tool with the resolution value no_change.
  Case c: If the role is sensitive, call the request_approval tool with the manager_id as the approver. Do not give the role. Call the close_request tool with the resolution value pending_approval.
  Case d: If none of the above fit, call the grant_role tool to give the role. Call the close_request tool with the resolution value role_granted.

  Finally, the last call of every conversation is the close_request tool. It takes the resolution value, the person id, and the role id. Never give a role twice and never request approval twice. The tools are lookup_person, check_access, request_approval, grant_role, and close_request.

plain_system_prompt: You are an IT assistant handling one request per conversation where someone asks for a role for a person. You must use exactly one tool call per message to check the system details. Only use the role identifier found in the tool result to confirm the request.

policy_shift:
  variant: all_grants_need_approval
  system_prompt: |-
    You work at an IT access desk where one conversation handles exactly one request. A person from a named department asks for a named role. You settle this request using your tools. You must follow these rules. Each message you send contains exactly one tool call. You never make up an id; you only use ids shown in a tool result. At this desk, you never give a role directly using the grant_role tool.

    Step 1: Find the person. Call the lookup_person tool with the full name from the request. Do not use the department as input. The result is a list of people. If the list has several people, choose the one whose department matches the request. Show the department, the account_state, and the manager_id for each person in the list.

    Step 2: Check the role. Call the check_access tool with the person id and the role name. The result shows the role id, the is_sensitive value, and the holds_role value.

    Step 3: Decide the action. Test cases in this order. Follow the first case that fits.
    Case a: If the account_state is inactive, do not give the role and do not ask for approval. Call the close_request tool with the resolution value refused.
    Case b: If the person already holds the role, do not give the role and do not ask for approval. Call the close_request tool with the resolution value no_change.
    Case c: If the account is in use and the person does not hold the role yet, call the request_approval tool with the manager_id as the approver. Do not give the role. Call the close_request tool with the resolution value pending_approval.

    Finally, the last call of every conversation is the close_request tool. It takes the resolution value, the person id, and the role id. Never give a role twice and never request approval twice. The tools are lookup_person, check_access, request_approval, and close_request.

id_prefixes:
  person: USR
  role: ROLE

tools:
  lookup_person:
    name: lookup_person
    description: The lookup_person tool takes a person_full_name and returns a list of people. Each person in the list includes person_id, person_full_name, department_name, account_state, and manager_id.
    params:
      name:
        name: person_full_name
        description: The person_full_name parameter expects the full name to search for.
  check_access:
    name: check_access
    description: The check_access tool takes a person_id and role_name. It returns the role_id, is_sensitive, and holds_role. No data changes.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person being checked for the role.
      role_name:
        name: role_name
        description: The role_name parameter expects the name of the role from the request, not its id.
  request_approval:
    name: request_approval
    description: This tool takes a person_id, role_id, and approver_id to create one record asking the approver to approve the role for that person. It returns a short confirmation and does not give the role itself.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that is the object of the approval request.
      approver_id:
        name: approver_id
        description: The approver_id parameter expects the id of the person asked to approve the request.
  grant_role:
    name: grant_role
    description: The grant_role tool assigns a role to a person immediately and records the action, then returns a short confirmation. It requires the person_id and role_id as input.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role being given to the person.
  close_request:
    name: close_request
    description: The close_request tool takes person_id, role_id, and request_resolution, writes the resolution to the request, closes it, and returns a short confirmation.
    params:
      resolution:
        name: request_resolution
        description: The request_resolution parameter expects one of four fixed values.
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person involved in the request.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that was requested.
  department_info:
    name: count_department
    description: The count_department tool takes a department_name and returns the department_name and department_people_count without making changes.
    params:
      department:
        name: department_name
        description: The parameter expects the name of a department.

result_keys:
  matches: people
  person_id: person_id
  name: person_full_name
  department: department_name
  status: account_state
  manager_id: manager_id
  role_id: role_id
  sensitive: is_sensitive
  has_access: holds_role
  result: success_message
  error: error_in_request
  member_count: department_people_count

values:
  status:
    active: active
    inactive: inactive
  resolution:
    granted: role_granted
    pending: pending_approval
    already: no_change
    denied: refused
  confirmation:
    approval_requested: request_approval recorded the request
    role_granted: Role granted to person
    request_closed: Request closed successfully

errors:
  unknown_person_id: The person with id {value} cannot be found in our records.
  unknown_role_name: The role named {value} does not exist in the company.
  unknown_role_id: The role with id {value} does not exist in the company system.
  unknown_approver_id: The approver id {value} does not match any person in the company.
  unknown_department: No department named {value} exists in the company system.
  malformed_call: Your message could not be used because it was not a single valid tool call.

request_templates:
  style_1:
  - Please grant the role of {role_name} to {person_name} from the {department}.
  - We request that {person_name} in {department} be assigned the {role_name}.
  - Kindly provide {person_name} with the {role_name} while they work in {department}.
  style_2:
  - 'Requester: {person_name} from {department} needs {role_name}'
  - 'New Access: Grant {role_name} to {person_name} in {department}'
  - 'Action Required: Assign {role_name} for {person_name} within {department}'
  style_3:
  - hey, please grant {role_name} to {person_name} for {department}
  - can you give {person_name} access to {role_name} since they are in {department}
  - please let {person_name} have {role_name} while they are in {department}
  style_4:
  - I am {person_name} from {department} and I need the {role_name} role so I can do my daily tasks.
  - Hello, I am {person_name} working in {department} and I am asking for the {role_name} to help me work.
  - My name is {person_name} and I belong to {department}, please give me the {role_name} so I can finish my work.

