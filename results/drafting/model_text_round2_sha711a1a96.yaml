system_prompt: |-
  You work at an IT access desk in a company where every conversation is one request for a named person from a named department to get a named role. You settle each request using your tools. In every message you send exactly one tool call and nothing else. Never make up an id or guess one; use an id only if a tool result shows it.

  Step 1: Call lookup_person with the full name from the request. Do not use the department as input. The result is a list of people with that name. If the list has several people, choose the one whose department matches the request department.

  Step 2: Call check_access with the person id and the requested role name. The result gives the role id, the is_sensitive value, and the holds_role value.

  Case a: If the account_state is inactive, do not grant the role and do not ask for approval. Call close_request with the resolution value request_denied.

  Case b: If the holds_role value is true, do not grant the role and do not ask for approval. Call close_request with the resolution value role_already_held.

  Case c: If the is_sensitive value is true, do not grant the role. Call request_approval using the manager_id from the Step 1 result. Then call close_request with the resolution value request_closing.

  Case d: If none of the previous cases fit, call grant_role to give the role to the person. Then call close_request with the resolution value role_granted.

  The last call in every conversation must be close_request. It takes the resolution value, the person id, and the role id as inputs. Never grant a role twice and never ask for approval twice.

plain_system_prompt: You work at an IT desk where one request means giving a role to a person. You must call exactly one tool in each message to settle the request. You may only use an id if a tool result shows it.

policy_shift:
  variant: all_grants_need_approval
  system_prompt: |-
    You work at an IT access desk in a company where every conversation is one request for a named person from a named department to get a named role. You settle each request using your tools. In every message you send exactly one tool call and nothing else. Never make up an id or guess one; use an id only if a tool result shows it.

    Step 1: Call lookup_person with the full name from the request. Do not use the department as input. The result is a list of people with that name. If the list has several people, choose the one whose department matches the request department.

    Step 2: Call check_access with the person id and the requested role name. The result gives the role id, the is_sensitive value, and the holds_role value.

    Case a: If the account_state is inactive, do not grant the role and do not ask for approval. Call close_request with the resolution value request_denied.

    Case b: If the holds_role value is true, do not grant the role and do not ask for approval. Call close_request with the resolution value role_already_held.

    Case c: If the account_state is active and the holds_role value is false, call request_approval using the manager_id from the Step 1 result. Then call close_request with the resolution value request_closing.

    The last call in every conversation must be close_request. It takes the resolution value, the person id, and the role id as inputs. Never call grant_role to give a role at this desk. Never ask for approval twice.

id_prefixes:
  person: USR
  role: ROLE

tools:
  lookup_person:
    name: lookup_person
    description: The lookup_person tool takes a person_full_name and returns a list of people. Each person in the list includes person_id, person_full_name, department_name, account_state, and manager_id.
    params:
      name:
        name: person_full_name
        description: The person_full_name parameter expects the full name to search for.
  check_access:
    name: check_access
    description: The check_access tool takes a person_id and role_name. It returns the role_id, is_sensitive, and holds_role. No data changes.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person being checked for the role.
      role_name:
        name: role_name
        description: The role_name parameter expects the name of the role from the request, not its id.
  request_approval:
    name: request_approval
    description: This tool takes a person_id, role_id, and approver_id to create one record asking the approver to approve the role for that person. It returns a short confirmation and does not give the role itself.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that is the object of the approval request.
      approver_id:
        name: approver_id
        description: The approver_id parameter expects the id of the person asked to approve the request.
  grant_role:
    name: grant_role
    description: The grant_role tool assigns a role to a person immediately and records the action, then returns a short confirmation. It requires the person_id and role_id as input.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role being given to the person.
  close_request:
    name: close_request
    description: The close_request tool takes person_id, role_id, and request_resolution, writes the resolution to the request, closes it, and returns a short confirmation.
    params:
      resolution:
        name: request_resolution
        description: The request_resolution parameter expects one of four fixed values.
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person involved in the request.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that was requested.
  department_info:
    name: count_department
    description: The count_department tool takes a department_name and returns the department_name and department_people_count without making changes.
    params:
      department:
        name: department_name
        description: The parameter expects the name of a department.

result_keys:
  matches: people
  person_id: person_id
  name: person_full_name
  department: department_name
  status: account_state
  manager_id: manager_id
  role_id: role_id
  sensitive: is_sensitive
  has_access: holds_role
  result: success_message
  error: error_in_request
  member_count: department_people_count

values:
  status:
    active: active
    inactive: inactive
  resolution:
    granted: role_granted
    pending: request_closing
    already: role_already_held
    denied: request_denied
  confirmation:
    approval_requested: request_approval recorded the request
    role_granted: Role granted to person
    request_closed: Request closed successfully

errors:
  unknown_person_id: We could not find a person with the ID {value}.
  unknown_role_name: We could not find a role named {value} in our system.
  unknown_role_id: The system found no role with the id {value}.
  unknown_approver_id: The approver id {value} does not match any person in the company.
  unknown_department: The department with the name {value} does not exist in our records.
  malformed_call: Your message could not be used because it did not contain exactly one valid tool call.

request_templates:
  style_1:
  - Please grant the role of {role_name} to {person_name} from the {department}.
  - We request that {person_name} in {department} be assigned the {role_name}.
  - Kindly provide {person_name} with the {role_name} while they work in {department}.
  style_2:
  - 'Requester: {person_name} from {department} needs {role_name}'
  - 'New Access: Grant {role_name} to {person_name} in {department}'
  - 'Action Required: Assign {role_name} for {person_name} within {department}'
  style_3:
  - hey hi, can you please give {person_name} the {role_name} in {department}?
  - hi there, {person_name} from {department} needs the {role_name} role now.
  - hello, {person_name} in {department} should get the {role_name} role today.
  style_4:
  - I am {person_name} from {department} and I need the {role_name} role to do my daily tasks.
  - I am {person_name} from {department}. I need the {role_name} role to complete my daily tasks.
  - Hi, I am {person_name} working in {department}. Please give me the {role_name} so I can do my job.

