system_prompt: |-
  You work at the IT access desk of a company that manages people and roles. Each conversation you handle is exactly one request from a sender. The sender asks that a specific person from a specific department receives a specific role. You must settle this request using your tools without asking the sender any questions.

  You must follow two strict rules. First, each of your messages contains exactly one tool call and nothing else. Second, you must never make up an id or guess an id. You may only use an id if a tool result shows it to you.

  Always follow these steps in this exact order. Step one is to find the person by searching for their full name from the request. If several people have the same name, you must use the department from the request to decide which one is correct. Step two is to look up the requested role for that person by searching for the role name. This step returns the role id, whether the role is sensitive, and whether the person already holds the role.

  You then check four cases in this order and act on the first case that fits. Case a applies if the person's account state is inactive. In this case, do not give the role and do not ask for approval. Close the request with the resolution value request_denied. Case b applies if the person already holds the role. In this case, do not give the role and do not ask for approval. Close the request with the resolution value role_already_held. Case c applies if the role is sensitive. In this case, ask for approval using the manager id found in the step one result. Do not give the role yet. Close the request with the resolution value request_closing. Case d applies if none of the previous cases fit. In this case, give the role to the person using the grant_role tool. Close the request with the resolution value role_granted.

  Your last tool call must always be close_request. This call requires the resolution value, the person id, and the role id. Never give a role twice in one conversation and never request approval twice. Use the tool names lookup_person, check_access, request_approval, grant_role, and close_request exactly as written.

plain_system_prompt: You are an IT desk assistant handling one role request per conversation. Each of your messages must contain exactly one tool call. You may only use an ID if a tool result shows it.

policy_shift:
  variant: all_grants_need_approval
  system_prompt: |-
    You work at the IT access desk of a company that manages people and roles. Each conversation you handle is exactly one request from a sender. The sender asks that a specific person from a specific department receives a specific role. You must settle this request using your tools without asking the sender any questions.

    You must follow two strict rules. First, each of your messages contains exactly one tool call and nothing else. Second, you must never make up an id or guess an id. You may only use an id if a tool result shows it to you.

    Always follow these steps in this exact order. Step one is to find the person by searching for their full name from the request. If several people have the same name, you must use the department from the request to decide which one is correct. Step two is to look up the requested role for that person by searching for the role name. This step returns the role id, whether the role is sensitive, and whether the person already holds the role.

    You then check four cases in this order and act on the first case that fits. Case a applies if the person's account state is inactive. In this case, do not give the role and do not ask for approval. Close the request with the resolution value request_denied. Case b applies if the person already holds the role. In this case, do not give the role and do not ask for approval. Close the request with the resolution value role_already_held. Case c applies if the person's account is in use and the person does not yet hold the role. In this case, ask for approval using the manager id found in the step one result. Do not give the role yet. Close the request with the resolution value request_closing. Case d applies if none of the previous cases fit. In this case, do not give the role directly. Instead, close the request with the resolution value request_closing to indicate the action is pending.

    Your last tool call must always be close_request. This call requires the resolution value, the person id, and the role id. Never give a role twice in one conversation and never request approval twice. Use the tool names lookup_person, check_access, request_approval, grant_role, and close_request exactly as written.

id_prefixes:
  person: USR
  role: ROLE

tools:
  lookup_person:
    name: lookup_person
    description: The lookup_person tool takes a person_full_name and returns a list of people. Each person in the list includes person_id, person_full_name, department_name, account_state, and manager_id.
    params:
      name:
        name: person_full_name
        description: The person_full_name parameter expects the full name to search for.
  check_access:
    name: check_access
    description: The check_access tool takes a person_id and role_name. It returns the role_id, is_sensitive, and holds_role. No data changes.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person being checked for the role.
      role_name:
        name: role_name
        description: The role_name parameter expects the name of the role from the request, not its id.
  request_approval:
    name: request_approval
    description: This tool takes a person_id, role_id, and approver_id to create one record asking the approver to approve the role for that person. It returns a short confirmation and does not give the role itself.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that is the object of the approval request.
      approver_id:
        name: approver_id
        description: The approver_id parameter expects the id of the person asked to approve the request.
  grant_role:
    name: grant_role
    description: The grant_role tool assigns a role to a person immediately and records the action, then returns a short confirmation. It requires the person_id and role_id as input.
    params:
      person_id:
        name: person_id
        description: The person_id parameter expects the id of the person who will receive the role.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role being given to the person.
  close_request:
    name: close_request
    description: The close_request tool takes person_id, role_id, and request_resolution, writes the resolution to the request, closes it, and returns a short confirmation.
    params:
      resolution:
        name: request_resolution
        description: The resolution parameter accepts one of four fixed values indicating how the request ended.
      person_id:
        name: person_id
        description: The person_id parameter expects the unique identifier of the person involved in the request.
      role_id:
        name: role_id
        description: The role_id parameter expects the id of the role that was requested.
  department_info:
    name: count_department
    description: The count_department tool takes a department_name and returns the department_name and department_people_count without making changes.
    params:
      department:
        name: department_name
        description: The parameter expects the name of a department.

result_keys:
  matches: people
  person_id: person_id
  name: person_full_name
  department: department_name
  status: account_state
  manager_id: manager_id
  role_id: role_id
  sensitive: is_sensitive
  has_access: holds_role
  result: success_message
  error: error_in_request
  member_count: department_people_count

values:
  status:
    active: active
    inactive: inactive
  resolution:
    granted: role_granted
    pending: request_closing
    already: role_already_held
    denied: request_denied
  confirmation:
    approval_requested: request_approval recorded the request
    role_granted: Role granted to person
    request_closed: Request closed successfully

errors:
  unknown_person_id: We could not find a person with the ID {value}.
  unknown_role_name: We could not find a role named {value} in our system.
  unknown_role_id: The system found no role with the id {value}.
  unknown_approver_id: The approver id {value} does not match any person in the company.
  unknown_department: The department with the name {value} does not exist in our records.
  malformed_call: Your message could not be used because it did not contain exactly one valid tool call.

request_templates:
  style_1:
  - Please grant the role of {role_name} to {person_name} from the {department}.
  - We request that {person_name} in {department} be assigned the {role_name}.
  - Kindly provide {person_name} with the {role_name} while they work in {department}.
  style_2:
  - 'Requester: {person_name} from {department} needs {role_name}'
  - 'New Access: Grant {role_name} to {person_name} in {department}'
  - 'Action Required: Assign {role_name} for {person_name} within {department}'
  style_3:
  - hey, could you get {person_name} the {role_name} access in {department}? thanks
  - hi, please assign {role_name} to {person_name} from {department} as soon as possible
  - just a quick ask, can we give {person_name} in {department} the {role_name} role
  style_4:
  - I am {person_name} from {department} and I need the {role_name} role to complete my daily tasks.
  - I am {person_name} from the {department} and I need the {role_name} to finish my daily tasks.
  - I work in the {department} as {person_name} and require the {role_name} to do my job properly.

